name: MiLAi Lab verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  active-package:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - name: Install locked Lab
        run: uv sync --frozen --dev --python 3.11

      - name: Verify active source boundary
        run: uv run milai-lab-check-boundary

      - name: Prepare Lab test evidence directory
        run: mkdir -p lab-test-results

      - name: Static checks
        run: |
          uv run ruff check src tests tools
          uv run mypy src/milai_lab

      - name: Run Lab pytest diagnostic
        run: >-
          uv run pytest -q --maxfail=1 --tb=long --durations=50
          --junitxml="${{ github.workspace }}/lab-test-results/junit.xml"

      - name: Upload Lab pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milai-lab-pytest-evidence
          path: lab-test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7

      - name: Replay filtered legacy snapshot
        if: success()
        run: uv run python tools/check_legacy_archive.py

      - name: Build clean distributions
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          uv build
          if unzip -l dist/*.whl | grep -E '(^|/)(studies|artifacts|\.venv|__pycache__)(/|$)'; then
            echo 'Archive or generated content leaked into Lab wheel' >&2
            exit 1
          fi
          if tar -tf dist/*.tar.gz | grep -E '(^|/)(studies/archive|artifacts|\.venv|__pycache__)(/|$)'; then
            echo 'Archive or generated content leaked into Lab sdist' >&2
            exit 1
          fi

      - name: Reject generated or private tracked paths
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden="$(
            git ls-files | grep -E \
              '(^|/)(\.venv|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|models|logs|dist|build)(/|$)|(^|/)\.env$' \
              || true
          )"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden generated/private paths:\n%s\n' "$forbidden" >&2
            exit 1
          fi

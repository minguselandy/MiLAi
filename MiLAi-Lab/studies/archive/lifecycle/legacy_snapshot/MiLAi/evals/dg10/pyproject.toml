[project]
name = "milai-dg10-benchmark-worker"
version = "0.1.0"
description = "Hermetic DG-10 remediation benchmark worker"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.19.1",
  "cryptography==50.0.0",
  "milai-runtime",
  "mpmath==1.3.0",
  "numpy==2.4.6",
  "pydantic==2.13.4",
  "pyyaml==6.0.3",
  "pytest==8.4.2",
  "ruff==0.16.3",
  "tenacity==8.5.0",
  "tokenizers==0.23.1",
  "tree-sitter==0.21.3",
  "tree-sitter-java==0.21.0",
  "tree-sitter-javascript==0.21.4",
]

[tool.uv.sources]
milai-runtime = { path = "wheels/milai_runtime-0.1.0-py3-none-any.whl" }

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["../../tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["E501", "S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402", "S603", "S607"]
"scripts/build_dg10_model_probe.py" = ["S310"]
"scripts/dg10_t2_provider_adapter.py" = ["S310"]
"scripts/build_dg10_musl_wheelhouse.py" = ["S108"]
"scripts/build_dg10_review_bundle.py" = ["S103"]
"scripts/dg10_quality_stats.py" = ["S311"]
"scripts/run_dg10_mcp_package_gate.py" = ["S105"]
"scripts/run_dg10_serving_characterization.py" = ["S310"]
"scripts/run_dg10_vllm_openworker_e2e.py" = ["S104", "S105", "S608"]
"scripts/validate_dg10_contracts.py" = ["RUF001"]
"tests/**/*.py" = ["S105", "S106", "S603", "S607"]

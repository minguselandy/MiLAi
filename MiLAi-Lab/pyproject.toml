[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "milai-lab"
version = "0.1.0"
description = "Independent experimentation and evaluation workspace for MiLAi"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "jsonschema>=4.23,<5",
  "mcp>=2,<3",
  "transformers>=4.52,<5",
  "tokenizers>=0.21,<0.23",
]

[project.scripts]
milai-lab-verify-product = "milai_lab.product_adapter.manifest:main"
milai-lab-check-boundary = "milai_lab.boundary:main"
milai-lab-check-tools-boundary = "milai_lab.tools_boundary:main"

[dependency-groups]
baseline-langmem = [
  "langmem @ git+https://github.com/langchain-ai/langmem.git@9d033b47d9ce53e37e92c92241b0496c0278932e",
  "langgraph-checkpoint-postgres>=2,<3",
  "langgraph-checkpoint-sqlite>=2,<3",
]
dev = [
  "build>=1.2,<2",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/milai_lab"]

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/README.md",
  "/configs",
  "/data/diagnostics",
  "/data/fixtures",
  "/data/locks/langmem-foundation.lock.json",
  "/data/locks/langmem-b1.lock.json",
  "/data/locks/milai-m1-v17.lock.json",
  "/data/locks/milai-m1-v18.lock.json",
  "/data/locks/milai-odr-v19.lock.json",
  "/data/locks/milai-freshness-projection-v19-a2.lock.json",
  "/data/locks/milai-freshness-projection-v19-a3.lock.json",
  "/data/locks/milai-ser-v20.lock.json",
  "/data/locks/milai-ser-v20-p4.lock.json",
  "/data/locks/milai-ser-v21-p5.lock.json",
  "/data/locks/milai-ser-v21-p6r2.lock.json",
  "/data/locks/milai-ser-v22.lock.json",
  "/data/locks/milai-ser-v22-p7r2.lock.json",
  "/data/locks/milai-ser-v22-p7r3.lock.json",
  "/data/manifests",
  "/docs",
  "/product.lock.json",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/tools",
  "/uv.lock",
]
exclude = [
  "/artifacts",
  "/studies/archive",
  "**/.cache/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.venv/**",
  "**/__pycache__/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a pinned MiLAi product instance",
  "e2e: runs a bounded end-to-end experiment",
  "regression: runs a heavy historical replay outside the PR-fast Lab gate",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["milai_lab"]
exclude = "(baselines/langmem_agent|baselines/langmem_identity|baselines/langmem_b1_identity|baselines/langmem_instrumentation|baselines/langmem_revision_store|methods/milai_m1/.*|methods/on_demand_reconstruction/.*|providers/langmem_chat|runners/langmem_foundation|runners/langmem_merit|runners/langmem_diagnostic|runners/langmem_m1_mechanism|runners/langmem_odr_mechanism|datasets/merit)\\.py$"

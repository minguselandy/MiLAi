[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "milai-client"
version = "0.1.0"
description = "Typed loopback client and Agent lifecycle facade for MiLAi"
requires-python = ">=3.11,<3.14"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3"]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/milai_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["milai_client"]

name: MiLAi full composition verification

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    name: Fail-fast source boundaries
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-composition')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify root layout, generated paths, nested Git and imports
        run: python3 MiLAi-Artifact-Archive/tools/verify_boundaries.py

  product-identity:
    name: Product identity manifest
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in Product manifest
        working-directory: MiLAi-Product
        run: python3 tools/build_product_manifest.py --check

  architecture-conformance:
    name: Current implementation conformance receipt
    needs: [boundaries, product-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen architecture lock and current receipt
        working-directory: MiLAi-Product
        run: python3 tools/verify_architecture_conformance.py --check

  product-runtime:
    name: Product Runtime and PostgreSQL
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: milai_owner
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: milai
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U milai_owner -d milai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create least-privilege login roles
        shell: bash
        run: |
          set -Eeuo pipefail
          api_password="$(openssl rand -hex 24)"
          steward_password="$(openssl rand -hex 24)"
          worker_password="$(openssl rand -hex 24)"
          audit_password="$(openssl rand -hex 24)"
          docker exec -i "${{ job.services.postgres.id }}" \
            psql --set=ON_ERROR_STOP=1 --username milai_owner --dbname milai \
            --set=api_password="$api_password" \
            --set=steward_password="$steward_password" \
            --set=worker_password="$worker_password" \
            --set=audit_password="$audit_password" <<'SQL'
          SELECT format('CREATE ROLE milai_api LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'api_password') \gexec
          SELECT format('CREATE ROLE milai_steward LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'steward_password') \gexec
          SELECT format('CREATE ROLE milai_worker LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'worker_password') \gexec
          SELECT format('CREATE ROLE milai_audit LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'audit_password') \gexec
          REVOKE ALL ON DATABASE milai FROM PUBLIC;
          GRANT CONNECT ON DATABASE milai TO milai_api, milai_steward, milai_worker, milai_audit;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
          {
            echo "MILAI_MIGRATION_DATABASE_URL=postgresql://milai_owner:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@127.0.0.1:15432/milai"
            echo "MILAI_DATABASE_URL=postgresql://milai_api:${api_password}@127.0.0.1:15432/milai"
            echo "MILAI_STEWARD_DATABASE_URL=postgresql://milai_steward:${steward_password}@127.0.0.1:15432/milai"
            echo "MILAI_WORKER_DATABASE_URL=postgresql://milai_worker:${worker_password}@127.0.0.1:15432/milai"
            echo "MILAI_AUDIT_DATABASE_URL=postgresql://milai_audit:${audit_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_API_DATABASE_URL=postgresql://milai_api:${api_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_STEWARD_DATABASE_URL=postgresql://milai_steward:${steward_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_WORKER_DATABASE_URL=postgresql://milai_worker:${worker_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_AUDIT_DATABASE_URL=postgresql://milai_audit:${audit_password}@127.0.0.1:15432/milai"
          } >> "$GITHUB_ENV"
      - name: Install locked Product Runtime
        working-directory: MiLAi-Product/runtime
        run: uv sync --frozen --dev --python 3.11
      - name: Static checks
        working-directory: MiLAi-Product/runtime
        run: |
          uv run ruff check src tests migrations
          uv run mypy
      - name: Runtime tests
        working-directory: MiLAi-Product/runtime
        env:
          MILAI_BLOB_ROOT: ${{ runner.temp }}/milai-blobs
          MILAI_TENANT_ID: 11111111-1111-4111-8111-111111111111
          MILAI_LOCAL_ACTOR_ID: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          MILAI_API_TOKEN: ci-runtime-token-derived-for-this-run-only
          MILAI_CAUSAL_TOKEN_SECRET: ci-causal-token-secret-is-distinct-per-run
          MILAI_BIND_HOST: 127.0.0.1
          MILAI_BIND_PORT: "18080"
        run: uv run pytest -q
      - name: Build clean Runtime distribution
        working-directory: MiLAi-Product/runtime
        run: uv build

  product-integrations:
    name: Product integration packages (${{ matrix.package }})
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [python-client, mcp, openworker-mcp, hooks, langgraph, autogen]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify locked integration package
        working-directory: MiLAi-Product/integrations/${{ matrix.package }}
        run: |
          uv sync --frozen --dev --python 3.11
          uv run ruff check src tests
          uv run mypy
          uv run pytest -q
          uv build

  lab:
    name: Lab active package and study boundary
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked Lab
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --python 3.11
      - name: Prepare Lab test evidence directory
        run: mkdir -p lab-test-results
      - name: Check active Lab boundaries
        working-directory: MiLAi-Lab
        run: |
          uv run milai-lab-check-boundary
          uv run milai-lab-check-tools-boundary
      - name: Run Lab static checks
        working-directory: MiLAi-Lab
        run: |
          uv run ruff check src tests tools
          uv run mypy src/milai_lab
      - name: Run Lab pytest diagnostic
        working-directory: MiLAi-Lab
        run: >-
          uv run pytest -q --maxfail=1 --tb=long --durations=50 -m 'not regression'
          --junitxml="${{ github.workspace }}/lab-test-results/junit.xml"
      - name: Upload Lab pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milai-lab-pytest-evidence
          path: lab-test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Replay filtered legacy snapshot
        if: success()
        working-directory: MiLAi-Lab
        run: uv run python tools/check_legacy_archive.py
      - name: Build clean Lab distributions
        if: success()
        working-directory: MiLAi-Lab
        run: uv build

  lab-langmem-foundation:
    name: Lab LangMem foundation
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked LangMem baseline
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --group baseline-langmem --python 3.11
      - name: Check LangMem foundation boundary and adapter
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_identity.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/datasets/merit.py tools/run_langmem_foundation.py tools/prepare_langmem_foundation.py tools/summarize_langmem_foundation.py tests/unit/test_langmem_foundation.py
          uv run --no-sync mypy src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_identity.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/datasets/merit.py
          uv run --no-sync pytest -q tests/unit/test_langmem_foundation.py

  lab-langmem-provenance:
    name: Lab LangMem provenance B1
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked LangMem baseline
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --group baseline-langmem --python 3.11
      - name: Check model-hidden observer and replay boundary
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_b1_identity.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/baselines/langmem_revision_store.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py tools/run_langmem_provenance.py tools/check_langmem_provenance_store.py tools/replay_langmem_provenance_v15.py tests/unit/test_langmem_provenance.py
          uv run --no-sync mypy --follow-imports=silent src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_b1_identity.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/baselines/langmem_revision_store.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py tools/run_langmem_provenance.py tools/check_langmem_provenance_store.py tools/replay_langmem_provenance_v15.py
          uv run --no-sync pytest -q tests/unit/test_langmem_provenance.py

  lab-milai-m1:
    name: Lab sparse Decision Basis M1
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked LangMem baseline
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --group baseline-langmem --python 3.11
      - name: Check opt-in M1 boundary
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/methods/milai_m1 src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_m1_mechanism.py tools/run_milai_m1.py tests/unit/test_milai_m1.py
          uv run --no-sync mypy --follow-imports=silent src/milai_lab/methods/milai_m1/*.py src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_m1_mechanism.py tools/run_milai_m1.py
          uv run --no-sync pytest -q tests/unit/test_milai_m1.py

  lab-regression:
    name: Lab historical replay (${{ matrix.name }})
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: presentation-v1
            timeout_minutes: 20
            pytest_target: tests/unit/test_v0222_presentation_integration.py
          - name: presentation-v2-positive
            timeout_minutes: 40
            pytest_target: >-
              tests/unit/test_v0222_presentation_integration_v2.py::test_complete_real_scoped_stack_16_then_24
          - name: presentation-v2-wrong-intent
            timeout_minutes: 20
            pytest_target: >-
              tests/unit/test_v0222_presentation_integration_v2.py::test_first_wrong_intent_stops_without_business_or_p4
          - name: presentation-v2-corruption
            timeout_minutes: 20
            pytest_target: >-
              tests/unit/test_v0222_presentation_integration_v2.py::test_actual_raw_and_visible_corruption_cannot_finish
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked Lab
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --python 3.11
      - name: Run historical replay shard
        working-directory: MiLAi-Lab
        run: >-
          uv run pytest -q --maxfail=1 --tb=long --durations=50 -m regression
          "${{ matrix.pytest_target }}"
          --junitxml="${{ github.workspace }}/lab-regression-${{ matrix.name }}.xml"
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milai-lab-regression-${{ matrix.name }}
          path: lab-regression-${{ matrix.name }}.xml
          if-no-files-found: warn
          retention-days: 7

  archive:
    name: Archive index and reorganization evidence
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive indexes and reports
        run: |
          python3 MiLAi-Artifact-Archive/tools/validate_archive.py \
            --archive-root MiLAi-Artifact-Archive
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("MiLAi-Artifact-Archive/manifests/reorganization/v1.0")
          summary = json.loads((root / "repo_inventory.summary.json").read_text())
          assert summary["coverage_percent"] == 100.0
          assert summary["unknown_count"] == 0
          assert summary["unresolved_diverged_count"] == 0
          assert (root / "DIVERGENCE_REVIEW.md").is_file()
          assert (root / "LEGACY_ONLY_REVIEW.md").is_file()
          print("PASS reorganization evidence gates")
          PY

  composition:
    name: Product/Lab/Archive composition gate
    needs:
      [
        product-identity,
        architecture-conformance,
        product-runtime,
        product-integrations,
        lab,
        lab-langmem-foundation,
        lab-milai-m1,
        lab-regression,
        archive,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm canonical top-level ownership
        run: |
          test -d MiLAi-Product
          test -d MiLAi-Lab
          test -d MiLAi-Artifact-Archive
          test ! -d runtime
          test ! -d integrations
          test ! -d contracts
          test ! -d architecture
          test ! -d evals
          test ! -d research
          test ! -d scripts
          test ! -d tests
          echo "PASS canonical composition"

name: MiLAi full composition verification

on:
  pull_request:
    types: [labeled, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  boundaries:
    name: Fail-fast source boundaries
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'full-composition')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify root layout, generated paths, nested Git and imports
        run: python3 MiLAi-Artifact-Archive/tools/verify_boundaries.py

  product-identity:
    name: Product identity manifest
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in Product manifest
        working-directory: MiLAi-Product
        run: python3 tools/build_product_manifest.py --check

  architecture-conformance:
    name: Current implementation conformance receipt
    needs: [boundaries, product-identity]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen architecture lock and current receipt
        working-directory: MiLAi-Product
        run: python3 tools/verify_architecture_conformance.py --check

  product-runtime:
    name: Product Runtime and PostgreSQL
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: milai_owner
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: milai
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U milai_owner -d milai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client
      - name: Create least-privilege login roles
        shell: bash
        run: |
          set -Eeuo pipefail
          api_password="$(openssl rand -hex 24)"
          steward_password="$(openssl rand -hex 24)"
          worker_password="$(openssl rand -hex 24)"
          audit_password="$(openssl rand -hex 24)"
          docker exec -i "${{ job.services.postgres.id }}" \
            psql --set=ON_ERROR_STOP=1 --username milai_owner --dbname milai \
            --set=api_password="$api_password" \
            --set=steward_password="$steward_password" \
            --set=worker_password="$worker_password" \
            --set=audit_password="$audit_password" <<'SQL'
          SELECT format('CREATE ROLE milai_api LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'api_password') \gexec
          SELECT format('CREATE ROLE milai_steward LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'steward_password') \gexec
          SELECT format('CREATE ROLE milai_worker LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'worker_password') \gexec
          SELECT format('CREATE ROLE milai_audit LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'audit_password') \gexec
          REVOKE ALL ON DATABASE milai FROM PUBLIC;
          GRANT CONNECT ON DATABASE milai TO milai_api, milai_steward, milai_worker, milai_audit;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
          {
            echo "MILAI_MIGRATION_DATABASE_URL=postgresql://milai_owner:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@127.0.0.1:15432/milai"
            echo "MILAI_DATABASE_URL=postgresql://milai_api:${api_password}@127.0.0.1:15432/milai"
            echo "MILAI_STEWARD_DATABASE_URL=postgresql://milai_steward:${steward_password}@127.0.0.1:15432/milai"
            echo "MILAI_WORKER_DATABASE_URL=postgresql://milai_worker:${worker_password}@127.0.0.1:15432/milai"
            echo "MILAI_AUDIT_DATABASE_URL=postgresql://milai_audit:${audit_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_API_DATABASE_URL=postgresql://milai_api:${api_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_STEWARD_DATABASE_URL=postgresql://milai_steward:${steward_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_WORKER_DATABASE_URL=postgresql://milai_worker:${worker_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_AUDIT_DATABASE_URL=postgresql://milai_audit:${audit_password}@127.0.0.1:15432/milai"
          } >> "$GITHUB_ENV"
      - name: Install locked Product Runtime
        working-directory: MiLAi-Product/runtime
        run: uv sync --frozen --dev --python 3.11
      - name: Static checks
        working-directory: MiLAi-Product/runtime
        run: |
          uv run ruff check src tests migrations
          uv run mypy
      - name: Runtime tests
        working-directory: MiLAi-Product/runtime
        env:
          MILAI_BLOB_ROOT: ${{ runner.temp }}/milai-blobs
          MILAI_TENANT_ID: 11111111-1111-4111-8111-111111111111
          MILAI_LOCAL_ACTOR_ID: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          MILAI_API_TOKEN: ci-runtime-token-derived-for-this-run-only
          MILAI_CAUSAL_TOKEN_SECRET: ci-causal-token-secret-is-distinct-per-run
          MILAI_BIND_HOST: 127.0.0.1
          MILAI_BIND_PORT: "18080"
        run: uv run pytest -q
      - name: Build clean Runtime distribution
        working-directory: MiLAi-Product/runtime
        run: uv build

  product-integrations:
    name: Product integration packages (${{ matrix.package }})
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [python-client, mcp, openworker-mcp, hooks, langgraph, autogen]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify locked integration package
        working-directory: MiLAi-Product/integrations/${{ matrix.package }}
        run: |
          uv sync --frozen --dev --python 3.11
          uv run ruff check src tests
          uv run mypy
          uv run pytest -q
          uv build

  lab:
    name: Lab active package and study boundary
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked Lab
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --python 3.11
      - name: Prepare Lab test evidence directory
        run: mkdir -p lab-test-results
      - name: Check active Lab boundaries
        working-directory: MiLAi-Lab
        run: |
          uv run milai-lab-check-boundary
          uv run milai-lab-check-tools-boundary
      - name: Run Lab static checks
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync python tools/check_verification_matrix.py
          uv run --no-sync ruff check src tests tools
          uv run --no-sync mypy src/milai_lab/contracts src/milai_lab/analysis src/milai_lab/harness src/milai_lab/scorers src/milai_lab/boundary.py src/milai_lab/tools_boundary.py src/milai_lab/memory/presentation.py src/milai_lab/methods/request_context.py src/milai_lab/methods/memory_result.py src/milai_lab/methods/memory_boundaries.py src/milai_lab/memory/embeddings.py src/milai_lab/providers/request_pipeline.py src/milai_lab/import_graph.py src/milai_lab/application/world.py
          if test -f tests/unit/test_lsa_controller_contract.py; then
            uv run --no-sync mypy src/milai_lab/methods/local_state_attention/protocol.py
            uv run --no-sync pytest -q tests/unit/test_lsa_controller_contract.py
          fi
      - name: Run Lab pytest diagnostic
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync pytest -q --maxfail=1 --tb=long --durations=50 -m 'not regression and not local_artifacts' \
          --ignore=tests/unit/test_langmem_foundation.py \
          --ignore=tests/unit/test_langmem_provenance.py \
          --ignore=tests/unit/test_freshness_projection.py \
          --ignore=tests/unit/test_milai_m1_v18.py \
          --ignore=tests/unit/test_milai_odr.py \
          --ignore=tests/unit/test_local_state_attention.py \
          --ignore=tests/unit/test_local_state_attention_read_probe.py \
          --ignore=tests/unit/test_frozen_action_continuation.py \
          --ignore=tests/unit/test_writer_policy.py \
          --ignore=tests/unit/test_state_update_probe.py \
          --ignore=tests/unit/test_fixed_state_read.py \
          --ignore=tests/unit/test_fixed_state_update.py \
          --ignore=tests/unit/test_shared_record_use.py \
          --ignore=tests/unit/test_persistent_memory.py \
          --ignore=tests/unit/test_langmem_application.py \
          --ignore=tests/unit/test_application_architecture.py \
          --ignore=tests/architecture/test_request_source_identity.py \
          --ignore=tests/memory/test_memory_contracts.py \
          --ignore=tests/memory/test_v13_1_service.py \
          --ignore=tests/memory/test_v13_1_d0.py \
          --ignore=tests/memory/test_v13_1_p5.py \
          --ignore=tests/memory/test_v13_1_p5_compare.py \
          --ignore=tests/memory/test_v13_1_document_publication.py \
          --ignore=tests/unit/test_v13_1_controls.py \
          --ignore=tests/unit/test_v13_1_baseline_micro.py \
          --ignore=tests/architecture/test_memory_architecture.py --ignore=tests/architecture/test_benchmark_execution_architecture.py --ignore=tests/architecture/test_provider_architecture.py --ignore=tests/architecture/test_writer_orchestration.py \
          --ignore=tests/integrations/test_mem0_contracts.py \
          --ignore=tests/integrations/test_simplemem_contracts.py \
          --ignore=tests/integrations/test_external_interfaces.py \
          --ignore=tests/unit/test_external_memory_v26.py \
          --ignore=tests/unit/test_unified_benchmarks.py \
          --ignore=tests/unit/test_benchmark_memories.py \
          --ignore=tests/unit/test_merit_native.py \
          --ignore=tests/unit/test_simplemem_native.py \
          --ignore=tests/application/test_v13_5_workflows.py \
          --ignore=tests/memory/test_v13_5_functional.py \
          --ignore=tests/unit/test_v13_5_functional_integration.py \
          --ignore=tests/application/test_v13_5_sdk_lifecycle.py \
          --ignore=tests/unit/test_v13_5_visibility_replay.py \
          --ignore=tests/memory/test_correction_chains.py --ignore=tests/memory/test_correction_evidence.py --ignore=tests/memory/test_correction_metadata.py --ignore=tests/memory/test_correction_spans.py --ignore=tests/memory/test_v13_2_common_boundary.py --ignore=tests/memory/test_v13_2_compact_material.py --ignore=tests/memory/test_v13_2_compact_storage_integration.py --ignore=tests/memory/test_v13_2_delivery.py --ignore=tests/memory/test_v13_2_derived_index.py --ignore=tests/memory/test_v13_2_direct_support.py --ignore=tests/memory/test_v13_2_fixed_flow_owned.py --ignore=tests/memory/test_v13_2_generation_admission.py --ignore=tests/memory/test_v13_2_history_discovery.py --ignore=tests/memory/test_v13_2_http_owner_entries.py --ignore=tests/memory/test_v13_2_observation.py --ignore=tests/memory/test_v13_2_packet.py --ignore=tests/memory/test_v13_2_public_memory_contracts.py --ignore=tests/memory/test_v13_2_read_protocol.py --ignore=tests/memory/test_v13_2_schema.py --ignore=tests/memory/test_v13_2_service.py --ignore=tests/memory/test_v13_2_source_index.py --ignore=tests/unit/test_tool_schema_communication.py --ignore=tests/unit/test_read_protocol.py \
          --junitxml="${{ github.workspace }}/lab-test-results/junit.xml"
      - name: Upload Lab pytest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milai-lab-pytest-evidence
          path: lab-test-results/junit.xml
          if-no-files-found: warn
          retention-days: 7
      - name: Replay filtered legacy snapshot
        if: success()
        working-directory: MiLAi-Lab
        run: uv run --no-sync python tools/check_legacy_archive.py
      - name: Build clean Lab distributions
        if: success()
        working-directory: MiLAi-Lab
        run: uv build

  lab-langmem-foundation:
    name: Lab LangMem foundation
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked LangMem baseline
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --group baseline-langmem --python 3.11
      - name: Check LangMem foundation boundary and adapter
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync python -c 'import langchain_core, langgraph, langmem, openai'
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_identity.py src/milai_lab/providers/langmem_chat.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/application src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/datasets/merit.py tools/run_langmem_foundation.py tools/prepare_langmem_foundation.py tools/summarize_langmem_foundation.py tests/unit/test_langmem_foundation.py
          uv run --no-sync mypy src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_identity.py src/milai_lab/providers/langmem_chat.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/application src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/datasets/merit.py
          uv run --no-sync pytest -q tests/unit/test_langmem_foundation.py
          uv run --no-sync mypy tools/run_persistent_memory.py
          uv run --no-sync mypy src/milai_lab/providers/merit_metered.py src/milai_lab/baselines/langmem_benchmark.py src/milai_lab/runners/memsyco_native.py src/milai_lab/runners/merit_native.py tools/run_unified_benchmarks.py
          uv run --no-sync pytest -q tests/unit/test_unified_benchmarks.py tests/unit/test_merit_native.py tests/unit/test_benchmark_memories.py tests/architecture/test_benchmark_execution_architecture.py
          uv run --no-sync mypy src/milai_lab
          uv run --no-sync mypy src/milai_lab/baselines/langmem_*.py src/milai_lab/baselines/benchmark_memories.py src/milai_lab/application/*.py src/milai_lab/methods/local_state_attention/*.py src/milai_lab/memory/*.py src/milai_lab/methods/milai_m1/*.py src/milai_lab/methods/on_demand_reconstruction/*.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_*.py src/milai_lab/runners/frozen_action_continuation.py src/milai_lab/runners/writer_policy.py src/milai_lab/runners/state_update_probe.py src/milai_lab/runners/fixed_state_read.py src/milai_lab/runners/fixed_state_update.py src/milai_lab/runners/shared_record_use.py src/milai_lab/runners/persistent_memory.py src/milai_lab/datasets/merit.py src/milai_lab/providers/merit_metered.py src/milai_lab/runners/memsyco_native.py src/milai_lab/runners/merit_native.py
          uv run --no-sync pytest -q -m 'not local_artifacts' tests/unit/test_local_state_attention.py tests/unit/test_langmem_application.py tests/unit/test_application_architecture.py tests/architecture/test_request_source_identity.py tests/memory/test_memory_contracts.py tests/memory/test_v13_1_service.py tests/memory/test_v13_1_d0.py tests/memory/test_v13_1_p5.py tests/memory/test_v13_1_p5_compare.py tests/memory/test_v13_1_document_publication.py tests/unit/test_v13_1_baseline_micro.py tests/unit/test_v13_1_controls.py tests/architecture/test_memory_architecture.py tests/unit/test_local_state_attention_read_probe.py tests/unit/test_frozen_action_continuation.py tests/unit/test_writer_policy.py tests/unit/test_state_update_probe.py tests/unit/test_fixed_state_read.py tests/unit/test_fixed_state_update.py tests/unit/test_shared_record_use.py tests/unit/test_persistent_memory.py tests/unit/test_langmem_provenance.py tests/unit/test_freshness_projection.py tests/unit/test_milai_m1_v18.py tests/unit/test_milai_odr.py tests/architecture/test_provider_architecture.py tests/architecture/test_writer_orchestration.py
          uv run --no-sync pytest -q tests/application/test_v13_5_workflows.py tests/memory/test_v13_5_functional.py tests/unit/test_v13_5_functional_integration.py tests/unit/test_v13_5_visibility_replay.py
          uv run --no-sync pytest -q tests/memory/test_correction_chains.py tests/memory/test_correction_evidence.py tests/memory/test_correction_metadata.py tests/memory/test_correction_spans.py tests/memory/test_v13_2_common_boundary.py tests/memory/test_v13_2_compact_material.py tests/memory/test_v13_2_compact_storage_integration.py tests/memory/test_v13_2_delivery.py tests/memory/test_v13_2_derived_index.py tests/memory/test_v13_2_direct_support.py tests/memory/test_v13_2_fixed_flow_owned.py tests/memory/test_v13_2_generation_admission.py tests/memory/test_v13_2_history_discovery.py tests/memory/test_v13_2_http_owner_entries.py tests/memory/test_v13_2_observation.py tests/memory/test_v13_2_packet.py tests/memory/test_v13_2_public_memory_contracts.py tests/memory/test_v13_2_read_protocol.py tests/memory/test_v13_2_schema.py tests/memory/test_v13_2_service.py tests/memory/test_v13_2_source_index.py tests/unit/test_tool_schema_communication.py tests/unit/test_read_protocol.py

  lab-external:
    name: Lab locked external adapter
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify Mem0 adapter with locked optional dependencies
        working-directory: MiLAi-Lab
        run: |
          uv sync --frozen --dev --group baseline-langmem --group external-mem0 --python 3.11
          uv pip install --python .venv/bin/python --no-deps https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          HF_HUB_DISABLE_TELEMETRY=1 uv run --no-sync python tools/prepare_external_memory_v26_assets.py --prepare
          uv run --no-sync python -c 'import langmem, mem0, spacy'
          uv pip install --python .venv/bin/python -r data/locks/unified-v8-v9-simplemem-text-20260929.requirements.txt
          uv run --no-sync python tools/prepare_simplemem_text_source.py --prepare
          uv run --no-sync mypy src/milai_lab/runners/mem0_native.py src/milai_lab/runners/mem0_identity.py src/milai_lab/runners/simplemem_native.py src/milai_lab/integrations/memory/mem0.py src/milai_lab/integrations/memory/simplemem.py
          uv run --no-sync pytest -q -m 'not local_artifacts' tests/unit/test_external_memory_v26.py tests/unit/test_simplemem_native.py tests/integrations/test_mem0_contracts.py tests/integrations/test_simplemem_contracts.py tests/integrations/test_external_interfaces.py tests/application/test_v13_5_sdk_lifecycle.py

  lab-langmem-provenance:
    name: Lab LangMem provenance B1
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked LangMem baseline
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --group baseline-langmem --python 3.11
      - name: Check model-hidden observer and replay boundary
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_b1_identity.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/baselines/langmem_revision_store.py src/milai_lab/providers/langmem_chat.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/application src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py tools/run_langmem_provenance.py tools/check_langmem_provenance_store.py tools/replay_langmem_provenance_v15.py tests/unit/test_langmem_provenance.py
          uv run --no-sync mypy --follow-imports=silent src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_b1_identity.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/baselines/langmem_revision_store.py src/milai_lab/providers/langmem_chat.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/application src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py tools/run_langmem_provenance.py tools/check_langmem_provenance_store.py tools/replay_langmem_provenance_v15.py
          uv run --no-sync pytest -q tests/unit/test_langmem_provenance.py

  lab-milai-m1:
    name: Lab sparse Decision Basis M1
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked LangMem baseline
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --group baseline-langmem --python 3.11
      - name: Check opt-in M1 boundary
        working-directory: MiLAi-Lab
        run: |
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/methods/milai_m1 src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/providers/langmem_chat.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_m1_mechanism.py tools/run_milai_m1.py tools/run_milai_m1_v18.py tools/inspect_milai_m1_v18.py tests/unit/test_milai_m1_v18.py
          uv run --no-sync mypy --follow-imports=silent src/milai_lab/methods/milai_m1/*.py src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_instrumentation.py src/milai_lab/providers/langmem_chat.py src/milai_lab/providers/chat_bridge.py src/milai_lab/providers/request_pipeline.py src/milai_lab/methods/langmem_recipe.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_m1_mechanism.py tools/run_milai_m1.py tools/run_milai_m1_v18.py tools/inspect_milai_m1_v18.py
          uv run --no-sync pytest -q tests/unit/test_milai_m1_v18.py

  lab-regression:
    name: Lab historical replay (${{ matrix.name }})
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: presentation-v1
            timeout_minutes: 20
            pytest_target: tests/unit/test_v0222_presentation_integration.py
          - name: presentation-v2-positive
            timeout_minutes: 40
            pytest_target: >-
              tests/unit/test_v0222_presentation_integration_v2.py::test_complete_real_scoped_stack_16_then_24
          - name: presentation-v2-wrong-intent
            timeout_minutes: 20
            pytest_target: >-
              tests/unit/test_v0222_presentation_integration_v2.py::test_first_wrong_intent_stops_without_business_or_p4
          - name: presentation-v2-corruption
            timeout_minutes: 20
            pytest_target: >-
              tests/unit/test_v0222_presentation_integration_v2.py::test_actual_raw_and_visible_corruption_cannot_finish
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Install locked Lab
        working-directory: MiLAi-Lab
        run: uv sync --frozen --dev --python 3.11
      - name: Run historical replay shard
        working-directory: MiLAi-Lab
        run: >-
          uv run pytest -q --maxfail=1 --tb=long --durations=50 -m regression
          "${{ matrix.pytest_target }}"
          --junitxml="${{ github.workspace }}/lab-regression-${{ matrix.name }}.xml"
      - name: Upload regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: milai-lab-regression-${{ matrix.name }}
          path: lab-regression-${{ matrix.name }}.xml
          if-no-files-found: warn
          retention-days: 7

  archive:
    name: Archive index and reorganization evidence
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate archive indexes and reports
        run: |
          python3 MiLAi-Artifact-Archive/tools/validate_archive.py \
            --archive-root MiLAi-Artifact-Archive
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("MiLAi-Artifact-Archive/manifests/reorganization/v1.0")
          summary = json.loads((root / "repo_inventory.summary.json").read_text())
          assert summary["coverage_percent"] == 100.0
          assert summary["unknown_count"] == 0
          assert summary["unresolved_diverged_count"] == 0
          assert (root / "DIVERGENCE_REVIEW.md").is_file()
          assert (root / "LEGACY_ONLY_REVIEW.md").is_file()
          print("PASS reorganization evidence gates")
          PY

  composition:
    name: Product/Lab/Archive composition gate
    needs:
      [
        product-identity,
        architecture-conformance,
        product-runtime,
        product-integrations,
        lab,
        lab-langmem-foundation,
        lab-external,
        lab-milai-m1,
        lab-regression,
        archive,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Confirm canonical top-level ownership
        run: |
          test -d MiLAi-Product
          test -d MiLAi-Lab
          test -d MiLAi-Artifact-Archive
          test ! -d runtime
          test ! -d integrations
          test ! -d contracts
          test ! -d architecture
          test ! -d evals
          test ! -d research
          test ! -d scripts
          test ! -d tests
          echo "PASS canonical composition"

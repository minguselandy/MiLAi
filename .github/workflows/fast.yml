name: MiLAi fast verification

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
    paths:
      - ".github/**"
      - "MiLAi-Product/**"
      - "MiLAi-Lab/**"
      - "MiLAi-Artifact-Archive/**"
      - "README.md"
      - "AGENTS.md"
      - "SOURCE_OF_TRUTH.md"
      - "REPO_MAP.md"
      - "LEGACY_READ_ONLY.md"
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify changed paths
    runs-on: ubuntu-latest
    outputs:
      runtime: ${{ steps.changes.outputs.runtime }}
      mcp: ${{ steps.changes.outputs.mcp }}
      openworker: ${{ steps.changes.outputs.openworker }}
      python_client: ${{ steps.changes.outputs.python_client }}
      hooks: ${{ steps.changes.outputs.hooks }}
      langgraph: ${{ steps.changes.outputs.langgraph }}
      autogen: ${{ steps.changes.outputs.autogen }}
      lab: ${{ steps.changes.outputs.lab }}
      archive: ${{ steps.changes.outputs.archive }}
      full_required: ${{ steps.changes.outputs.full_required }}
      integration_matrix: ${{ steps.changes.outputs.integration_matrix }}
      integration_count: ${{ steps.changes.outputs.integration_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify the exact event diff
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -Eeuo pipefail
          changed_paths="$(mktemp)"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths"
          python3 .github/scripts/classify_changes.py \
            --paths-file "$changed_paths" \
            --github-output "$GITHUB_OUTPUT"
      - name: Test the classifier contract
        run: python3 .github/scripts/test_classify_changes.py -q

  boundaries:
    name: Fail-fast source boundaries
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify root layout, generated paths, nested Git and imports
        run: python3 MiLAi-Artifact-Archive/tools/verify_boundaries.py

  product-identity:
    name: Product identity manifest
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in Product manifest
        working-directory: MiLAi-Product
        run: python3 tools/build_product_manifest.py --check

  architecture-conformance:
    name: Current implementation conformance receipt
    needs: product-identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen architecture lock and current receipt
        working-directory: MiLAi-Product
        run: python3 tools/verify_architecture_conformance.py --check

  main-tree-identity:
    name: Tested PR tree identity
    if: github.event_name == 'push'
    needs: boundaries
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Match main to its tested pull-request tree
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/verify_main_tree_identity.py

  runtime-fast:
    name: Product Runtime fast gate
    if: github.event_name == 'pull_request' && needs.classify.outputs.runtime == 'true'
    needs: [classify, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify Runtime without PostgreSQL integration collection
        working-directory: MiLAi-Product/runtime
        run: |
          uv sync --frozen --dev --python 3.11
          uv run ruff check src tests migrations
          uv run mypy
          uv run pytest -q tests/unit tests/contract
          uv build

  product-integrations-fast:
    name: Product integration fast gate (${{ matrix.package }})
    if: >-
      github.event_name == 'pull_request' &&
      needs.classify.outputs.integration_count != '0'
    needs: [classify, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.classify.outputs.integration_matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify affected locked integration package
        working-directory: MiLAi-Product/integrations/${{ matrix.package }}
        run: |
          uv sync --frozen --dev --python 3.11
          uv run ruff check src tests
          uv run mypy
          uv run pytest -q
          uv build

  lab-fast:
    name: Lab fast gate
    if: github.event_name == 'pull_request' && needs.classify.outputs.lab == 'true'
    needs: [classify, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify active Lab package and boundaries
        working-directory: MiLAi-Lab
        run: |
          uv sync --frozen --dev --python 3.11
          uv run --no-sync python tools/check_verification_matrix.py
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync milai-lab-check-tools-boundary
          uv run --no-sync ruff check src tests tools
          uv run --no-sync mypy src/milai_lab/contracts src/milai_lab/analysis src/milai_lab/harness src/milai_lab/scorers src/milai_lab/boundary.py src/milai_lab/tools_boundary.py
          if test -f tests/unit/test_lsa_controller_contract.py; then
            uv run --no-sync mypy src/milai_lab/methods/local_state_attention/protocol.py
            uv run --no-sync pytest -q tests/unit/test_lsa_controller_contract.py
          fi
          uv run --no-sync pytest -q --maxfail=1 -m 'not regression and not local_artifacts' \
            --ignore=tests/unit/test_langmem_foundation.py \
            --ignore=tests/unit/test_langmem_provenance.py \
            --ignore=tests/unit/test_freshness_projection.py \
            --ignore=tests/unit/test_milai_m1_v18.py \
            --ignore=tests/unit/test_milai_odr.py \
            --ignore=tests/unit/test_local_state_attention.py \
            --ignore=tests/unit/test_local_state_attention_read_probe.py \
            --ignore=tests/unit/test_frozen_action_continuation.py \
            --ignore=tests/unit/test_writer_policy.py \
            --ignore=tests/unit/test_langmem_application.py \
            --ignore=tests/unit/test_external_memory_v26.py
          uv run --no-sync python tools/check_legacy_archive.py
          uv build

  lab-langmem-foundation-fast:
    name: Lab LangMem foundation fast gate
    if: github.event_name == 'pull_request' && needs.classify.outputs.lab == 'true'
    needs: [classify, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify locked optional foundation
        working-directory: MiLAi-Lab
        run: |
          uv sync --frozen --dev --group baseline-langmem --python 3.11
          uv run --no-sync python -c 'import langchain_core, langgraph, langmem, openai'
          uv run --no-sync milai-lab-check-boundary
          uv run --no-sync ruff check src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_identity.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/datasets/merit.py tools/run_langmem_foundation.py tools/prepare_langmem_foundation.py tools/summarize_langmem_foundation.py tests/unit/test_langmem_foundation.py
          uv run --no-sync mypy src/milai_lab/baselines/langmem_agent.py src/milai_lab/baselines/langmem_identity.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_foundation.py src/milai_lab/runners/langmem_merit.py src/milai_lab/runners/langmem_diagnostic.py src/milai_lab/datasets/merit.py
          uv run --no-sync pytest -q tests/unit/test_langmem_foundation.py
          uv run --no-sync ruff check src/milai_lab/methods/local_state_attention src/milai_lab/baselines/langmem_agent.py src/milai_lab/runners/langmem_application.py src/milai_lab/runners/langmem_application_runtime.py tools/run_local_state_attention.py tests/unit/test_local_state_attention.py
          uv run --no-sync mypy src/milai_lab/methods/local_state_attention/bank.py src/milai_lab/methods/local_state_attention/controller.py src/milai_lab/methods/local_state_attention/integration.py src/milai_lab/baselines/langmem_agent.py src/milai_lab/runners/langmem_application.py src/milai_lab/runners/langmem_application_runtime.py tools/run_local_state_attention.py
          uv run --no-sync pytest -q tests/unit/test_local_state_attention.py tests/unit/test_langmem_application.py
          uv run --no-sync ruff check src/milai_lab/methods/local_state_attention/read_probe.py tools/run_local_state_attention_read_probe.py tests/unit/test_local_state_attention_read_probe.py
          uv run --no-sync mypy src/milai_lab/methods/local_state_attention/read_probe.py tools/run_local_state_attention_read_probe.py
          uv run --no-sync pytest -q tests/unit/test_local_state_attention_read_probe.py
          uv run --no-sync ruff check src/milai_lab/runners/frozen_action_continuation.py tools/run_frozen_action_continuation.py tests/unit/test_frozen_action_continuation.py
          uv run --no-sync mypy src/milai_lab/runners/frozen_action_continuation.py tools/run_frozen_action_continuation.py
          uv run --no-sync pytest -q tests/unit/test_frozen_action_continuation.py
          uv run --no-sync ruff check src/milai_lab/runners/writer_policy.py tools/run_writer_policy.py tests/unit/test_writer_policy.py
          uv run --no-sync mypy src/milai_lab/runners/writer_policy.py tools/run_writer_policy.py
          uv run --no-sync pytest -q tests/unit/test_writer_policy.py
          uv run --no-sync mypy src/milai_lab
          uv run --no-sync mypy src/milai_lab/baselines/langmem_*.py src/milai_lab/methods/local_state_attention/*.py src/milai_lab/methods/milai_m1/*.py src/milai_lab/methods/on_demand_reconstruction/*.py src/milai_lab/providers/langmem_chat.py src/milai_lab/runners/langmem_*.py src/milai_lab/runners/frozen_action_continuation.py src/milai_lab/runners/writer_policy.py src/milai_lab/datasets/merit.py
          uv run --no-sync pytest -q -m 'not local_artifacts' tests/unit/test_langmem_provenance.py tests/unit/test_freshness_projection.py tests/unit/test_milai_m1_v18.py tests/unit/test_milai_odr.py

  lab-external-fast:
    name: Lab locked external adapter fast gate
    if: github.event_name == 'pull_request' && needs.classify.outputs.lab == 'true'
    needs: [classify, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true
      - name: Verify locked Mem0 adapter and collected tests
        working-directory: MiLAi-Lab
        run: |
          uv sync --frozen --dev --group baseline-langmem --group external-mem0 --python 3.11
          uv pip install --python .venv/bin/python --no-deps https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl
          HF_HUB_DISABLE_TELEMETRY=1 uv run --no-sync python tools/prepare_external_memory_v26_assets.py --prepare
          uv run --no-sync python -c 'import langmem, mem0, spacy'
          uv run --no-sync mypy src/milai_lab/runners/mem0_native.py src/milai_lab/runners/mem0_identity.py
          uv run --no-sync pytest -q tests/unit/test_external_memory_v26.py

  archive-fast:
    name: Archive validation
    if: github.event_name == 'pull_request' && needs.classify.outputs.archive == 'true'
    needs: [classify, boundaries]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate Archive indexes
        run: >-
          python3 MiLAi-Artifact-Archive/tools/validate_archive.py
          --archive-root MiLAi-Artifact-Archive

  fast-gate:
    name: Fast verification gate
    if: always()
    needs:
      - classify
      - boundaries
      - product-identity
      - architecture-conformance
      - main-tree-identity
      - runtime-fast
      - product-integrations-fast
      - lab-fast
      - lab-langmem-foundation-fast
      - lab-external-fast
      - archive-fast
    runs-on: ubuntu-latest
    steps:
      - name: Require every selected fast check
        env:
          CLASSIFY: ${{ needs.classify.result }}
          BOUNDARIES: ${{ needs.boundaries.result }}
          IDENTITY: ${{ needs.product-identity.result }}
          CONFORMANCE: ${{ needs.architecture-conformance.result }}
          TREE_IDENTITY: ${{ needs.main-tree-identity.result }}
          RUNTIME: ${{ needs.runtime-fast.result }}
          INTEGRATIONS: ${{ needs.product-integrations-fast.result }}
          LAB: ${{ needs.lab-fast.result }}
          LAB_LANGMEM: ${{ needs.lab-langmem-foundation-fast.result }}
          LAB_EXTERNAL: ${{ needs.lab-external-fast.result }}
          LAB_SELECTED: ${{ needs.classify.outputs.lab }}
          ARCHIVE: ${{ needs.archive-fast.result }}
          FULL_REQUIRED: ${{ needs.classify.outputs.full_required }}
        shell: bash
        run: |
          set -Eeuo pipefail
          for result in \
            "$CLASSIFY" "$BOUNDARIES" "$IDENTITY" "$CONFORMANCE" \
            "$TREE_IDENTITY" "$RUNTIME" "$INTEGRATIONS" "$LAB" \
            "$LAB_LANGMEM" "$LAB_EXTERNAL" "$ARCHIVE"; do
            case "$result" in
              success|skipped) ;;
              *) echo "selected fast job did not pass: $result" >&2; exit 1 ;;
            esac
          done
          if [[ "${{ github.event_name }}" == 'pull_request' && "$LAB_SELECTED" == 'true' ]]; then
            for result in "$LAB" "$LAB_LANGMEM" "$LAB_EXTERNAL"; do
              if [[ "$result" != 'success' ]]; then
                echo "selected Lab check did not pass: $result" >&2
                exit 1
              fi
            done
          fi
          echo "full_required=$FULL_REQUIRED"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "milai-autogen"
version = "0.1.0"
description = "AutoGen-style Memory adapter for governed MiLAi memory"
requires-python = ">=3.11,<3.14"
dependencies = ["autogen-core==0.7.5", "milai-client>=0.1,<0.2"]

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.uv.sources]
milai-client = {path = "../python-client", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/milai_autogen"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["milai_autogen"]

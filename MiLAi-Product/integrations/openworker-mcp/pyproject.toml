[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "milai-openworker-mcp"
version = "0.1.0"
description = "Host-owned OpenWorker task-memory integration for MiLAi MCP"
requires-python = ">=3.11,<3.13"
dependencies = [
  "milai-client>=0.1,<0.2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
milai-mcp-broker = "milai_openworker_mcp.broker:main"
milai-mcp-relay = "milai_openworker_mcp.relay:main"
milai-openworker-adapter = "milai_openworker_mcp.host_adapter:main"

[dependency-groups]
dev = ["mypy>=1.14,<2", "pytest>=8.3,<9", "ruff>=0.9,<1"]

[tool.uv.sources]
milai-client = {path = "../python-client", editable = true}

[tool.hatch.build.targets.wheel]
packages = ["src/milai_openworker_mcp"]
exclude = ["src/milai_openworker_mcp/adapter.py"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.venv",
  "/.pytest_cache",
  "/.ruff_cache",
  "/build",
  "/dist",
  "/wheelhouse",
  "**/__pycache__/**",
  "**/*.pyc",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true
packages = ["milai_openworker_mcp"]
exclude = ["^src/milai_openworker_mcp/adapter\\.py$"]

name: milai-lean-v1

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MILAI_POSTGRES_DB:-milai}
      POSTGRES_USER: milai_owner
      POSTGRES_PASSWORD: ${MILAI_OWNER_DB_PASSWORD:?Set MILAI_OWNER_DB_PASSWORD in runtime/.env}
      MILAI_API_DB_PASSWORD: ${MILAI_API_DB_PASSWORD:?Set MILAI_API_DB_PASSWORD in runtime/.env}
      MILAI_STEWARD_DB_PASSWORD: ${MILAI_STEWARD_DB_PASSWORD:?Set MILAI_STEWARD_DB_PASSWORD in runtime/.env}
      MILAI_WORKER_DB_PASSWORD: ${MILAI_WORKER_DB_PASSWORD:?Set MILAI_WORKER_DB_PASSWORD in runtime/.env}
      MILAI_AUDIT_DB_PASSWORD: ${MILAI_AUDIT_DB_PASSWORD:?Set MILAI_AUDIT_DB_PASSWORD in runtime/.env}
    ports:
      - "127.0.0.1:${MILAI_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milai_owner -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - milai_postgres_data:/var/lib/postgresql/data
      - ./docker/initdb/010_roles.sh:/docker-entrypoint-initdb.d/010_roles.sh:ro
    security_opt:
      - no-new-privileges:true

volumes:
  milai_postgres_data:


[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "milai-runtime"
version = "0.1.5"
description = "MiLAi Lean V1 experimental local memory runtime"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic>=1.14,<2",
  "cryptography>=45,<51",
  "flask>=3.1,<4",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "waitress>=3.0,<4",
]

[project.optional-dependencies]
embedding = [
  "numpy>=1.26,<3",
  "onnxruntime>=1.22,<2",
  "tokenizers>=0.21,<1",
]

[project.scripts]
milai-api = "milai.api.cli:main"
milai-worker = "milai.workers.main:main"
milai-db-check = "milai.persistence.cli:main"
milai-ops = "milai.operations.cli:main"
milai-context-testkit = "milai.testkit.cli:main"
milai-retrieval-trace-testkit = "milai.testkit.retrieval_trace_cli:main"

[dependency-groups]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "pyyaml>=6,<7",
  "ruff>=0.9,<1",
  "types-waitress>=0.1.0,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/milai"]

[tool.hatch.build.targets.wheel.force-include]
"alembic.ini" = "milai/_alembic.ini"
"migrations" = "milai/_migrations"

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/.python-version",
  "/README.md",
  "/alembic.ini",
  "/compose.yaml",
  "/docker",
  "/migrations",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/uv.lock",
]
exclude = [
  "**/.cache/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.ruff_cache/**",
  "**/.venv/**",
  "**/__pycache__/**",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a real PostgreSQL instance",
  "security: exercises role, tenant, or permission boundaries",
]

[tool.coverage.run]
branch = true
source = ["milai"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S105", "S106"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["milai"]
exclude = ["migrations"]

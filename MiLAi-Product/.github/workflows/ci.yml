name: MiLAi Product verification

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  boundary-and-architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - name: Install locked Runtime tools
        working-directory: runtime
        run: uv sync --frozen --dev --python 3.11

      - name: Enforce Product source boundary
        run: |
          runtime/.venv/bin/python - <<'PY'
          import ast
          from pathlib import Path

          roots = [Path("runtime/src"), Path("runtime/tests"), Path("integrations")]
          forbidden = {"evals", "milai_lab", "research", "scripts"}
          violations = []
          for root in roots:
              for path in root.rglob("*.py"):
                  tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
                  for node in ast.walk(tree):
                      if isinstance(node, ast.Import):
                          names = {alias.name.split(".", 1)[0] for alias in node.names}
                      elif isinstance(node, ast.ImportFrom) and node.module:
                          names = {node.module.split(".", 1)[0]}
                      else:
                          continue
                      blocked = names & forbidden
                      if blocked:
                          violations.append(f"{path}:{node.lineno}: {sorted(blocked)}")
          if violations:
              raise SystemExit("Product/Lab import boundary violated:\n" + "\n".join(violations))
          PY

      - name: Reject generated or private trees
        shell: bash
        run: |
          set -Eeuo pipefail
          forbidden="$(
            git ls-files | grep -E \
              '(^|/)(\.venv|__pycache__|\.pytest_cache|\.mypy_cache|\.ruff_cache|wheelhouse|backups|logs|var|dist|build)(/|$)|(^|/)\.env$' \
              || true
          )"
          if [[ -n "$forbidden" ]]; then
            printf 'Forbidden generated/private paths:\n%s\n' "$forbidden" >&2
            exit 1
          fi

      - name: Frozen Logical Architecture bundle gate
        env:
          MILAI_ARCHITECTURE_LOCK_SCOPE: bundle
        run: |
          runtime/.venv/bin/ruff format --check architecture/v1.0/scripts architecture/v1.0/tests
          runtime/.venv/bin/ruff check architecture/v1.0/scripts architecture/v1.0/tests
          runtime/.venv/bin/python architecture/v1.0/scripts/validate_bundle.py
          runtime/.venv/bin/python architecture/v1.0/scripts/verify_lock.py \
            --scope bundle --mode release \
            --expected-manifest-sha256 ac16f3b7f9413a7b2d8373b6e7d306697df0bc7908572bb3b0344260d8a55d0e
          runtime/.venv/bin/python - <<'PY'
          import unittest

          legacy_only = (
              "test_bundle.ArchitectureBundleTest."
              "test_manifest_refresh_updates_only_declared_paths"
          )
          suite = unittest.defaultTestLoader.discover("architecture/v1.0/tests")
          selected = unittest.TestSuite()
          omitted = []

          def cases(candidate):
              for item in candidate:
                  if isinstance(item, unittest.TestSuite):
                      yield from cases(item)
                  else:
                      yield item

          for case in cases(suite):
              if case.id() == legacy_only:
                  omitted.append(case.id())
              else:
                  selected.addTest(case)
          if omitted != [legacy_only]:
              raise SystemExit(f"unexpected legacy-only test selection: {omitted!r}")
          result = unittest.TextTestRunner(verbosity=2).run(selected)
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: milai_owner
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: milai
        ports:
          - 15432:5432
        options: >-
          --health-cmd "pg_isready -U milai_owner -d milai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - name: Install PostgreSQL client tools
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Create least-privilege login roles
        shell: bash
        run: |
          set -Eeuo pipefail
          api_password="$(openssl rand -hex 24)"
          steward_password="$(openssl rand -hex 24)"
          worker_password="$(openssl rand -hex 24)"
          audit_password="$(openssl rand -hex 24)"
          docker exec -i "${{ job.services.postgres.id }}" \
            psql --set=ON_ERROR_STOP=1 --username milai_owner --dbname milai \
            --set=api_password="$api_password" \
            --set=steward_password="$steward_password" \
            --set=worker_password="$worker_password" \
            --set=audit_password="$audit_password" <<'SQL'
          SELECT format('CREATE ROLE milai_api LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'api_password') \gexec
          SELECT format('CREATE ROLE milai_steward LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'steward_password') \gexec
          SELECT format('CREATE ROLE milai_worker LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'worker_password') \gexec
          SELECT format('CREATE ROLE milai_audit LOGIN PASSWORD %L NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS', :'audit_password') \gexec
          REVOKE ALL ON DATABASE milai FROM PUBLIC;
          GRANT CONNECT ON DATABASE milai TO milai_api, milai_steward, milai_worker, milai_audit;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          SQL
          {
            echo "MILAI_MIGRATION_DATABASE_URL=postgresql://milai_owner:ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@127.0.0.1:15432/milai"
            echo "MILAI_DATABASE_URL=postgresql://milai_api:${api_password}@127.0.0.1:15432/milai"
            echo "MILAI_STEWARD_DATABASE_URL=postgresql://milai_steward:${steward_password}@127.0.0.1:15432/milai"
            echo "MILAI_WORKER_DATABASE_URL=postgresql://milai_worker:${worker_password}@127.0.0.1:15432/milai"
            echo "MILAI_AUDIT_DATABASE_URL=postgresql://milai_audit:${audit_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_API_DATABASE_URL=postgresql://milai_api:${api_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_STEWARD_DATABASE_URL=postgresql://milai_steward:${steward_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_WORKER_DATABASE_URL=postgresql://milai_worker:${worker_password}@127.0.0.1:15432/milai"
            echo "MILAI_TEST_AUDIT_DATABASE_URL=postgresql://milai_audit:${audit_password}@127.0.0.1:15432/milai"
          } >> "$GITHUB_ENV"

      - name: Install locked Runtime
        working-directory: runtime
        run: uv sync --frozen --dev --python 3.11

      - name: Static verification
        working-directory: runtime
        run: |
          uv run ruff check src tests migrations
          uv run mypy

      - name: Runtime tests with real PostgreSQL roles
        working-directory: runtime
        env:
          MILAI_BLOB_ROOT: ${{ runner.temp }}/milai-blobs
          MILAI_TENANT_ID: 11111111-1111-4111-8111-111111111111
          MILAI_LOCAL_ACTOR_ID: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
          MILAI_API_TOKEN: ci-runtime-token-derived-for-this-run-only
          MILAI_CAUSAL_TOKEN_SECRET: ci-causal-token-secret-is-distinct-per-run
          MILAI_BIND_HOST: 127.0.0.1
          MILAI_BIND_PORT: "18080"
        run: uv run pytest -q

      - name: Build Runtime artifacts
        working-directory: runtime
        run: uv build

  integrations:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        package: [python-client, mcp, openworker-mcp, hooks, langgraph, autogen]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.3"
          enable-cache: true

      - name: Verify locked integration package
        working-directory: integrations/${{ matrix.package }}
        shell: bash
        run: |
          set -Eeuo pipefail
          uv sync --frozen --dev --python 3.11
          uv run ruff check src tests
          if uv run python -c 'import tomllib, pathlib; d=tomllib.loads(pathlib.Path("pyproject.toml").read_text()); raise SystemExit(0 if "mypy" in d.get("tool", {}) else 1)'; then
            uv run mypy
          fi
          uv run pytest -q
          uv build

      - name: Reject OpenWorker wheelhouse leakage
        if: matrix.package == 'openworker-mcp'
        working-directory: integrations/openworker-mcp
        shell: bash
        run: |
          set -Eeuo pipefail
          if unzip -l dist/*.whl | grep -E '(^|/)(wheelhouse|\.venv|__pycache__)(/|$)'; then
            echo 'Generated/private files leaked into OpenWorker wheel' >&2
            exit 1
          fi
          if tar -tf dist/*.tar.gz | grep -E '(^|/)(wheelhouse|\.venv|__pycache__)(/|$)'; then
            echo 'Generated/private files leaked into OpenWorker sdist' >&2
            exit 1
          fi
